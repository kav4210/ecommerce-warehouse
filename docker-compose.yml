services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dbt
      POSTGRES_PASSWORD: dbt
      POSTGRES_DB: ecom
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbt -d ecom"]
      interval: 3s
      retries: 20
  dbt:
    build: .
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      PGHOST: postgres
      PGUSER: dbt
      PGPASSWORD: dbt
      PGDATABASE: ecom
volumes:
  pgdata:
