version: 2
models:
  - name: dim_date
    columns:
      - name: date_key
        tests: [unique, not_null]
  - name: dim_product
    columns:
      - name: product_key
        tests: [unique, not_null]
  - name: dim_seller
    columns:
      - name: seller_key
        tests: [unique, not_null]
  - name: dim_customer
    columns:
      - name: customer_key
        tests: [unique, not_null]
      - name: valid_from
        tests: [not_null]
  - name: fct_orders
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_key
        tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_customer'), field: customer_key}
      - name: order_date_key
        tests:
          - relationships:
              arguments: {to: ref('dim_date'), field: date_key}
  - name: fct_order_items
    columns:
      - name: product_key
        tests:
          - relationships:
              arguments: {to: ref('dim_product'), field: product_key}
      - name: seller_key
        tests:
          - relationships:
              arguments: {to: ref('dim_seller'), field: seller_key}
      - name: customer_key
        tests:
          - relationships:
              arguments: {to: ref('dim_customer'), field: customer_key}
